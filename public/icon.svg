<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="60%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFE4A0"/>
      <stop offset="50%" stop-color="#FFB8C8"/>
      <stop offset="100%" stop-color="#F090A8"/>
    </radialGradient>
    <radialGradient id="petalCenter" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#FFD4A0"/>
      <stop offset="100%" stop-color="#FF8FAE"/>
    </radialGradient>
    <radialGradient id="petalOuter" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFB8CC"/>
      <stop offset="100%" stop-color="#F07090"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE880"/>
      <stop offset="100%" stop-color="#FFBE40"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Golden circle arc -->
  <circle cx="256" cy="240" r="155" fill="none" stroke="#F5C040" stroke-width="4" stroke-dasharray="700 200" stroke-dashoffset="-60" opacity="0.85"/>

  <!-- Back petals (lower layer) -->
  <!-- Left back petal -->
  <ellipse cx="178" cy="270" rx="58" ry="105" fill="url(#petalOuter)" transform="rotate(-38 178 270)" opacity="0.9"/>
  <!-- Right back petal -->
  <ellipse cx="334" cy="270" rx="58" ry="105" fill="url(#petalOuter)" transform="rotate(38 334 270)" opacity="0.9"/>
  <!-- Far left petal -->
  <ellipse cx="142" cy="295" rx="44" ry="90" fill="#F898B8" transform="rotate(-62 142 295)" opacity="0.75"/>
  <!-- Far right petal -->
  <ellipse cx="370" cy="295" rx="44" ry="90" fill="#F898B8" transform="rotate(62 370 295)" opacity="0.75"/>

  <!-- Center front petals -->
  <!-- Center top petal -->
  <ellipse cx="256" cy="195" rx="62" ry="115" fill="url(#petalCenter)" opacity="0.95"/>
  <!-- Center left petal -->
  <ellipse cx="200" cy="265" rx="56" ry="100" fill="url(#petalCenter)" transform="rotate(-22 200 265)" opacity="0.92"/>
  <!-- Center right petal -->
  <ellipse cx="312" cy="265" rx="56" ry="100" fill="url(#petalCenter)" transform="rotate(22 312 265)" opacity="0.92"/>

  <!-- Petal vein lines -->
  <line x1="256" y1="195" x2="256" y2="295" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
  <line x1="200" y1="240" x2="235" y2="300" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="312" y1="240" x2="277" y2="300" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- Flower center -->
  <circle cx="256" cy="295" r="32" fill="url(#centerGlow)" opacity="0.95"/>

  <!-- Stamens -->
  <g fill="#FFD840" opacity="0.95">
    <circle cx="256" cy="266" r="5"/>
    <circle cx="270" cy="271" r="5"/>
    <circle cx="242" cy="271" r="5"/>
    <circle cx="278" cy="280" r="4.5"/>
    <circle cx="234" cy="280" r="4.5"/>
    <circle cx="256" cy="276" r="4.5"/>
    <line x1="256" y1="271" x2="256" y2="288" stroke="#FFD840" stroke-width="2"/>
    <line x1="270" y1="276" x2="268" y2="288" stroke="#FFD840" stroke-width="2"/>
    <line x1="242" y1="276" x2="244" y2="288" stroke="#FFD840" stroke-width="2"/>
    <line x1="278" y1="284" x2="274" y2="293" stroke="#FFD840" stroke-width="1.5"/>
    <line x1="234" y1="284" x2="238" y2="293" stroke="#FFD840" stroke-width="1.5"/>
  </g>

  <!-- Stem and leaves -->
  <path d="M256 325 Q248 360 238 390 Q230 415 225 440" stroke="#F07090" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Small leaf right -->
  <ellipse cx="305" cy="375" rx="28" ry="14" fill="#F898B8" transform="rotate(-20 305 375)" opacity="0.85"/>
  <!-- Small leaf left -->
  <ellipse cx="218" cy="410" rx="22" ry="11" fill="#F090A0" transform="rotate(15 218 410)" opacity="0.8"/>

  <!-- Sparkle top-left -->
  <g transform="translate(130,140)" opacity="0.9">
    <polygon points="0,-12 2.5,-2.5 12,0 2.5,2.5 0,12 -2.5,2.5 -12,0 -2.5,-2.5" fill="#F5C040"/>
  </g>
  <!-- Sparkle top-right -->
  <g transform="translate(365,118)" opacity="0.85">
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#F5C040"/>
  </g>
  <!-- Sparkle bottom-left -->
  <g transform="translate(118,360)" opacity="0.75">
    <polygon points="0,-8 1.8,-1.8 8,0 1.8,1.8 0,8 -1.8,1.8 -8,0 -1.8,-1.8" fill="#F5C060"/>
  </g>
  <!-- Small dot accents -->
  <circle cx="390" cy="210" r="5" fill="#F5C040" opacity="0.7"/>
  <circle cx="148" cy="310" r="4" fill="#F5C040" opacity="0.6"/>
  <circle cx="370" cy="340" r="3.5" fill="#FFB0C8" opacity="0.7"/>
</svg>
